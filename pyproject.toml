[project]
name = "folio-agent"
version = "0.2.0"
description = "A document-focused adaptation of the Deep Agents harness"
requires-python = ">=3.12"
dependencies = [
  "deepagents>=0.7.0,<0.8",
  "langchain-openai>=1.0,<2",
  "langgraph-checkpoint-sqlite>=3,<4",
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "python-multipart>=0.0.20",
  "python-docx>=1.2,<2",
  "openpyxl>=3.1,<4",
  "pydantic-settings>=2.8,<3",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.28", "ruff>=0.11"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/folio"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
